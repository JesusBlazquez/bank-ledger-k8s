# A two-node cluster with the ports an ingress controller needs, so http://ledger.local works.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ledger
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
  - role: worker
