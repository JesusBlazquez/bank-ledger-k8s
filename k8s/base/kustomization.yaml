apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ledger

# `labels` with includeSelectors false, not the older commonLabels: labels added to a Deployment's
# selector cannot be changed afterwards, because selectors are immutable.
labels:
  - pairs:
      app.kubernetes.io/part-of: bank-ledger
    includeSelectors: false

resources:
  - namespace.yaml
  - app-config.yaml
  - db-secret.yaml
  - postgres.yaml
  - app.yaml
  - ingress.yaml
