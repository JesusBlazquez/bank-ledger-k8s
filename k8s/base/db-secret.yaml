apiVersion: v1
kind: Secret
metadata:
  name: ledger-db-credentials
type: Opaque
stringData:
  # Demo credentials, committed on purpose so the example runs with one command.
  # A real cluster takes these from a sealed secret, an external secrets operator or the
  # cloud provider's secret manager; they never live in git.
  DB_USERNAME: ledger
  DB_PASSWORD: ledger-local-only
