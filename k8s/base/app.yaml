apiVersion: v1
kind: Service
metadata:
  name: ledger-app
  labels:
    app.kubernetes.io/name: ledger-app
spec:
  selector:
    app.kubernetes.io/name: ledger-app
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-app
  labels:
    app.kubernetes.io/name: ledger-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ledger-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never take capacity away during a deploy: add the new pod first, then remove the old one.
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ledger-app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/jesusblazquez/bank-ledger-k8s:latest
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: ledger-config
            - secretRef:
                name: ledger-db-credentials
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            # The filesystem is read-only, so the JVM needs a writable temp directory.
            - name: tmp
              mountPath: /tmp
          # Three probes answering three different questions.
          startupProbe:
            # "Has it finished booting?" Gives the JVM and Flyway time without a long liveness delay.
            httpGet:
              path: /actuator/health/readiness
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            # "Can it take traffic right now?" A failure removes the pod from the service.
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
          livenessProbe:
            # "Is it stuck?" A failure restarts the container, so it must not check the database.
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
      volumes:
        - name: tmp
          emptyDir: {}
