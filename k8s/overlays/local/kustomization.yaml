apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# The image is built locally and loaded into kind, so it is never pulled from a registry.
images:
  - name: ghcr.io/jesusblazquez/bank-ledger-k8s
    newName: bank-ledger-k8s
    newTag: local

patches:
  - path: app-local-patch.yaml
